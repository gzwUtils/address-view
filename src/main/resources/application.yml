server:
  port: 8089

portal:
  cookie-secure: ${PORTAL_COOKIE_SECURE:true}
  allowed-origins: ${PORTAL_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
  admin-password-hash: ${PORTAL_ADMIN_PASSWORD_HASH:}
  github:
    sync-enabled: ${PORTAL_GITHUB_SYNC_ENABLED:true}
    token: ${GITHUB_API_TOKEN:}

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:13306/protal?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      encoding: UTF-8


mybatis:
  type-aliases-package: kd.address.view.entity
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    kd.address.view.mapper: debug
